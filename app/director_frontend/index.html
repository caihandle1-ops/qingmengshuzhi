<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>擎梦数智 · 汇报导演模式</title>
  <link rel="stylesheet" href="director.css">
</head>
<body>
<main id="director" class="director" aria-label="汇报导演模式" tabindex="-1">
  <header class="topbar">
    <div class="brand"><img id="brand-logo" alt="擎梦数智 Logo" hidden><span><b id="brand-name">擎梦数智</b><small>财报智问 · 汇报导演</small></span></div>
    <div class="top-actions"><button id="configure" type="button" aria-expanded="false" aria-controls="editor">编排章节</button><button id="fullscreen" type="button">全屏</button><button id="exit" type="button" class="exit">退出汇报 ↗</button></div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <p class="rail-heading">汇报片目 <span id="chapter-count"></span></p>
      <nav id="chapters" aria-label="汇报章节"></nav>
      <div class="rail-bottom"><span class="manual-dot"></span>手动推进<small>← → 切页 · 空格下一页<br>Esc 退出汇报</small></div>
    </aside>
    <section class="viewport" id="viewport" aria-label="汇报画布">
      <div class="stage-grid" aria-hidden="true"></div><div class="stage-ring" aria-hidden="true"></div>
      <div id="stage" class="stage"></div>
      <aside class="editor" id="editor" aria-label="选择与排列汇报章节" hidden>
        <div class="editor-title"><h2>排出你的汇报节奏。</h2><button id="close-editor" type="button" aria-label="关闭章节编排">×</button></div>
        <p>勾选要讲的章节，用上移／下移调整顺序。至少保留一章。</p>
        <div id="editor-list"></div>
        <div class="editor-footer"><span>编排仅保留在本次打开的汇报中。</span><button id="reset-order" type="button">恢复默认</button></div>
      </aside>
    </section>
  </div>
  <footer class="controlbar"><div class="chapter-progress"><b id="position">01</b><span id="total">/ 01</span><span id="identity" class="identity"></span></div><p id="status" aria-live="polite">正在载入已有记录</p><div class="page-actions"><button id="previous" type="button" aria-label="上一章">←</button><button id="next" type="button" aria-label="下一章">→</button></div></footer>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</main>
<script src="director-model.js"></script>
<script src="director.js"></script>
</body>
</html>
